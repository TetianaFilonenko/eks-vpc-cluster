server:
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 256Mi
  persistentVolume:
    enabled: false

alertmanager:
  enabled: false

kube-state-metrics:
  enabled: false

prometheus-node-exporter:
  enabled: false

prometheus-pushgateway:
  enabled: false

extraScrapeConfigs: |
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets:
        - pushgateway-prometheus-pushgateway.monitoring.svc.cluster.local:9091
